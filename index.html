
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Crush ❤️</title>
<style>
body {
  background: linear-gradient(135deg,#ffd1dc,#ff9aaf);
  font-family: sans-serif;
  text-align: center;
  padding: 50px 15px;
  color: #8b2445;
}
.card {
  background: white;
  padding: 30px 20px;
  border-radius: 25px;
  max-width: 350px;
  margin: auto;
  box-shadow: 0 8px 25px #d66a8a55;
}
button {
  background: #ff5c8a;
  color: white;
  border: none;
  padding: 14px 25px;
  border-radius: 30px;
  font-size: 17px;
}
#letter { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>❤️ Hello CRUSH ❤️</h1>
  <p>ဂျူး အတွက် Surprise လေးတစ်ခုရှိတယ်</p>
  <h1>💌</h1>
  <button onclick="openLetter()">Open My Letter</button>
  <div id="letter">
    <h2>For You ❤️</h2>
    <p>ဂျူး ကိုတွေ့ပြီးနောက်ပိုင်း
    နေ့ရက်လေးတွေက ပိုပြီးလှပလာတယ်။</p>
    <p>ဂျူးပြုံးနေတာလေးကို မြင်ရရင်
    ကျ​​ေနာ်လည်း ပျော်ရွှင်မိတယ်။</p>
    <h2>💕 You Are Special 💕</h2>
  </div>
</div>
<script>
function openLetter() {
  document.getElementById("letter").style.display = "block";
}
</script>
</body>
</html>
